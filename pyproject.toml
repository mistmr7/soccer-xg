[project]
name = "soccerxg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michael Mistarz", email = "michael.mistarz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "pandas>=3.0.2",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "statsbombpy>=1.22.0",
]

[project.scripts]
soccerxg = "soccerxg:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
